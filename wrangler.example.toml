# Optional Wrangler configuration.
# Replace the placeholder IDs before renaming this file to wrangler.toml.
# You can also configure these bindings directly in the Cloudflare Pages dashboard.

name = "wrxpy-site"
pages_build_output_dir = "."

[[kv_namespaces]]
binding = "SITE_DATA"
id = "YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "SITE_ASSETS"
bucket_name = "YOUR_R2_BUCKET_NAME"
