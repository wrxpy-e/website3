<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>wrxpy — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
<div class="noise"></div><div class="pointer"></div><div class="wipe"></div>
<header class="nav">
	<a class="logo" href="index.html">wrxpy</a>
	<nav><a href="index.html">site</a><a href="showcase.html">showcase</a></nav>
	<a class="nav-button" href="index.html">back to site <b>↗</b></a>
</header>

<main class="admin">
	<div class="admin-head">
		<span class="label">site management</span>
		<h1>Admin</h1>
		<p>Manage the profile, showcase and music.</p>
	</div>

	<section class="card gate" id="gate" hidden>
		<span class="label">owner verification</span>
		<h2>Admin access</h2>
		<p>Verify with the site owner's Discord account to continue.</p>
	</section>

	<div id="panel" hidden>
		<section class="card a-card">
			<span class="label">profile</span>
			<h2>Site profile</h2>
			<div class="grid2">
				<label>Name<input id="f-name" autocomplete="off"></label>
				<label>Role<input id="f-role"></label>
				<label class="full">Bio<textarea id="f-bio" rows="3"></textarea></label>
				<label>Status<select id="f-status"><option value="open">Open</option><option value="closed">Closed</option></select></label>
				<label>Status text<input id="f-statusText"></label>
				<label>Avatar URL<input id="f-avatar" type="url" placeholder="https://…"></label>
				<label>Discord URL<input id="f-discord" type="url" placeholder="https://…"></label>
				<label>Roblox URL<input id="f-roblox" type="url" placeholder="https://…"></label>
				<label>Quote<input id="f-quote"></label>
				<label>Quote by<input id="f-quoteBy"></label>
				<label class="full">Commission heading<input id="f-cta_title"></label>
				<label class="full">Commission text<textarea id="f-cta_text" rows="2"></textarea></label>
				<label class="full">Specialties <small>One per line: title | description</small><textarea id="f-specialties" rows="4"></textarea></label>
				<label class="full">Process <small>One per line: title | description</small><textarea id="f-process" rows="4"></textarea></label>
			</div>
			<div class="row"><button class="btn solid" id="saveCfg" type="button">Save profile</button><button class="btn ghost" id="resetCfg" type="button">Reset profile</button></div>
		</section>

		<section class="card a-card">
			<span class="label">portfolio</span>
			<h2>Showcase</h2>
			<div class="add-box">
				<input id="n-title" aria-label="Piece title" placeholder="Piece title">
				<select id="n-cat" aria-label="Category"><option>Clothing</option><option>Liveries</option><option>Logos</option><option>Graphics</option></select>
				<input id="n-url" type="url" aria-label="Image URL" placeholder="Image URL (https://…)">
				<label class="btn ghost file">Upload image<input id="n-file" type="file" accept="image/*" hidden></label>
				<button class="btn solid" id="addItem" type="button">Add piece</button>
			</div>
			<div class="row"><button class="btn ghost" id="importStarter" type="button" hidden>Import starter pieces</button></div>
			<div class="item-list" id="itemList"></div>
		</section>

		<section class="card a-card">
			<span class="label">audio</span>
			<h2>Music</h2>
			<div class="add-box">
				<input id="music-title" aria-label="Track title" placeholder="Track title">
				<input id="music-url" type="url" aria-label="Audio URL" placeholder="Audio URL (https://…)">
				<label class="btn ghost file">Upload audio<input id="music-file" type="file" accept="audio/*" hidden></label>
				<span id="music-upload-name" class="hint"></span>
				<button class="btn ghost" id="addTrack" type="button">Add track</button>
			</div>
			<label>Playlist <small>One per line: title | audio URL</small><textarea id="f-tracks" rows="6"></textarea></label>
			<div class="row"><button class="btn solid" id="saveTracks" type="button">Save music</button><button class="btn ghost" id="resetTracks" type="button">Use built-in tracks</button></div>
		</section>
	</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
<script src="admin.js"></script>
</body>
</html>
